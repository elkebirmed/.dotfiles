# Rendered by Noctalia from the active palette. Edit the palette, not this file.

[mgr]
cwd              = { fg = "{{colors.terminal_normal_cyan.default.hex}}" }
find_keyword     = { fg = "{{colors.terminal_normal_yellow.default.hex}}", bold = true, italic = true, underline = true }
find_position    = { fg = "{{colors.terminal_normal_magenta.default.hex}}", bg = "{{colors.terminal_background.default.hex}}", bold = true, italic = true }
symlink_target   = { italic = true }
marker_copied    = { fg = "{{colors.terminal_normal_green.default.hex}}", bg = "{{colors.terminal_normal_green.default.hex}}" }
marker_cut       = { fg = "{{colors.terminal_normal_red.default.hex}}", bg = "{{colors.terminal_normal_red.default.hex}}" }
marker_marked    = { fg = "{{colors.terminal_normal_cyan.default.hex}}", bg = "{{colors.terminal_normal_cyan.default.hex}}" }
marker_selected  = { fg = "{{colors.terminal_normal_yellow.default.hex}}", bg = "{{colors.terminal_normal_yellow.default.hex}}" }
count_copied     = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.terminal_normal_green.default.hex}}" }
count_cut        = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.terminal_normal_red.default.hex}}" }
count_selected   = { fg = "{{colors.terminal_normal_black.default.hex}}", bg = "{{colors.terminal_normal_yellow.default.hex}}" }
border_style     = { fg = "{{colors.outline.default.hex}}" }
syntect_theme    = "~/.config/bat/themes/noctalia.tmTheme"

[tabs]
active   = { bg = "{{colors.terminal_normal_blue.default.hex}}", bold = true }
inactive = { fg = "{{colors.terminal_normal_blue.default.hex}}", bg = "{{colors.surface_variant.default.hex}}" }

[mode]
normal_main = { bg = "{{colors.terminal_normal_blue.default.hex}}", bold = true }
normal_alt  = { fg = "{{colors.terminal_normal_blue.default.hex}}", bg = "{{colors.surface_variant.default.hex}}" }
select_main = { bg = "{{colors.terminal_normal_red.default.hex}}", bold = true }
select_alt  = { fg = "{{colors.terminal_normal_red.default.hex}}", bg = "{{colors.surface_variant.default.hex}}" }
unset_main  = { bg = "{{colors.terminal_normal_red.default.hex}}", bold = true }
unset_alt   = { fg = "{{colors.terminal_normal_red.default.hex}}", bg = "{{colors.surface_variant.default.hex}}" }

[indicator]
parent  = { reversed = true }
current = { reversed = true }
preview = { underline = true }

[status]
overall     = { fg = "{{colors.terminal_foreground.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }
perm_sep    = { fg = "{{colors.terminal_bright_black.default.hex}}" }
perm_type   = { fg = "{{colors.terminal_normal_green.default.hex}}" }
perm_read   = { fg = "{{colors.terminal_normal_yellow.default.hex}}" }
perm_write  = { fg = "{{colors.terminal_normal_red.default.hex}}" }
perm_exec   = { fg = "{{colors.terminal_normal_cyan.default.hex}}" }
progress_label   = { bold = true }
progress_normal  = { fg = "{{colors.terminal_normal_green.default.hex}}", bg = "{{colors.terminal_normal_black.default.hex}}" }
progress_error   = { fg = "{{colors.terminal_normal_yellow.default.hex}}", bg = "{{colors.terminal_normal_red.default.hex}}" }

[which]
border          = { fg = "{{colors.terminal_normal_blue.default.hex}}" }
cand            = { fg = "{{colors.terminal_normal_cyan.default.hex}}" }
rest            = { fg = "{{colors.terminal_bright_black.default.hex}}" }
desc            = { fg = "{{colors.terminal_normal_magenta.default.hex}}" }
separator_style = { fg = "{{colors.terminal_bright_black.default.hex}}" }

[confirm]
border  = { fg = "{{colors.terminal_normal_blue.default.hex}}" }
title   = { fg = "{{colors.terminal_normal_blue.default.hex}}" }
body    = { fg = "{{colors.terminal_foreground.default.hex}}" }
btn_yes = { reversed = true }

[spot]
border    = { fg = "{{colors.terminal_normal_blue.default.hex}}" }
title     = { fg = "{{colors.terminal_normal_blue.default.hex}}" }
tbl_col   = { fg = "{{colors.terminal_normal_blue.default.hex}}" }
tbl_cell  = { fg = "{{colors.terminal_normal_yellow.default.hex}}", reversed = true }

[notify]
title_info  = { fg = "{{colors.terminal_normal_green.default.hex}}" }
title_warn  = { fg = "{{colors.terminal_normal_yellow.default.hex}}" }
title_error = { fg = "{{colors.terminal_normal_red.default.hex}}" }

[pick]
border   = { fg = "{{colors.terminal_normal_blue.default.hex}}" }
active   = { fg = "{{colors.terminal_normal_magenta.default.hex}}", bold = true }
inactive = { fg = "{{colors.terminal_foreground.default.hex}}" }

[input]
border   = { fg = "{{colors.terminal_normal_blue.default.hex}}" }
value    = { fg = "{{colors.terminal_foreground.default.hex}}" }
selected = { reversed = true }

[cmp]
border   = { fg = "{{colors.terminal_normal_blue.default.hex}}" }
active   = { reversed = true }
inactive = { fg = "{{colors.terminal_foreground.default.hex}}" }

[tasks]
border  = { fg = "{{colors.terminal_normal_blue.default.hex}}" }
hovered = { fg = "{{colors.terminal_normal_magenta.default.hex}}", bold = true }

[help]
border  = { fg = "{{colors.terminal_normal_blue.default.hex}}" }
chord   = { fg = "{{colors.terminal_normal_cyan.default.hex}}" }
hovered = { reversed = true, bold = true }

[filetype]
rules = [
	{ mime = "**/image/*", fg = "{{colors.terminal_normal_yellow.default.hex}}" },
	{ mime = "**/{audio,video}/*", fg = "{{colors.terminal_normal_magenta.default.hex}}" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "{{colors.terminal_normal_red.default.hex}}" },
	{ mime = "**/application/{pdf,doc,rtf}", fg = "{{colors.terminal_normal_cyan.default.hex}}" },
	{ mime = "vfs/{absent,stale}", fg = "{{colors.terminal_bright_black.default.hex}}" },
	{ url = "*", is = "orphan", bg = "{{colors.terminal_normal_red.default.hex}}" },
	{ url = "*", is = "exec", fg = "{{colors.terminal_normal_green.default.hex}}" },
	{ url = "*/", fg = "{{colors.terminal_normal_blue.default.hex}}" }
]
