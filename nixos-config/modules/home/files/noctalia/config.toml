[include]
autoload = false
files = ["runtime.toml"]

[shell.screenshot]
skip_annotate_on_copy_save = false
close_on_copy = true
close_on_save = true

[location]
address = "Blida, DZ"

[notification.filter.layouts]
enabled = false

[backdrop]
enabled = true

[wallpaper]
enabled = true

[theme]
mode = "dark"

[theme.templates.user.niri_colors]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/niri-colors.kdl"
output_path = "$XDG_CONFIG_HOME/niri/colors.kdl"

[theme.templates.user.kitty_colors]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/kitty-colors.conf"
output_path = "$XDG_CONFIG_HOME/kitty/kitty-colors.conf"
post_hook = "bash '{{ config_dir }}/hooks/kitty.sh'"

[theme.templates.user.fish_colors]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/fish-colors.fish"
output_path = "$XDG_CONFIG_HOME/fish/conf.d/noctalia-colors.fish"

[theme.templates.user.lsd_colors]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/lsd-colors.yaml"
output_path = "$XDG_CONFIG_HOME/lsd/colors.yaml"

[theme.templates.user.starship_colors]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/starship.toml"
output_path = "$XDG_CONFIG_HOME/starship.toml"

[theme.templates.user.bat]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/bat.tmTheme"
output_path = "$XDG_CONFIG_HOME/bat/themes/noctalia.tmTheme"
post_hook = "bash '{{ config_dir }}/hooks/bat.sh'"

[theme.templates.user.fzf]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/fzf.opts"
output_path = "$XDG_CONFIG_HOME/fzf/themes/noctalia"

[theme.templates.user.zellij]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/zellij.kdl"
output_path = "$XDG_CONFIG_HOME/zellij/themes/noctalia.kdl"

[theme.templates.user.yazi]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/yazi.toml"
output_path = "$XDG_CONFIG_HOME/yazi/theme.toml"

[theme.templates.user.neovim]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/matugen.lua"
output_path = "$XDG_CONFIG_HOME/nvim/lua/matugen.lua"

[theme.templates.user.lazygit]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/lazygit.yml"
output_path = "$XDG_CONFIG_HOME/lazygit/themes/noctalia.yml"
post_hook = "bash '{{ config_dir }}/hooks/lazygit.sh'"

[theme.templates.user.opencode]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/opencode.json"
output_path = "$XDG_CONFIG_HOME/opencode/themes/matugen.json"

[theme.templates.user.pi_agent]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/pi-theme.json"
output_path = "~/.pi/agent/themes/noctalia.json"
post_hook = "bash '{{ config_dir }}/hooks/pi-agent.sh'"

[theme.templates.user.zen_browser_chrome]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/zen-userChrome.css"
output_path = "$XDG_CACHE_HOME/noctalia/zen-browser/zen-userChrome.css"
post_hook = "bash '{{ config_dir }}/hooks/zen-browser.sh'"
hook_async = false

[theme.templates.user.zen_browser_content]
input_path = "$XDG_CONFIG_HOME/noctalia/templates/zen-userContent.css"
output_path = "$XDG_CACHE_HOME/noctalia/zen-browser/zen-userContent.css"
post_hook = "bash '{{ config_dir }}/hooks/zen-browser.sh'"
hook_async = false

[plugins]
auto_update = "all"

[[plugins.source]]
name = "official"
kind = "git"
location = "https://github.com/noctalia-dev/official-plugins"
enabled = true

[[plugins.source]]
name = "community"
kind = "git"
location = "https://github.com/noctalia-dev/community-plugins"
enabled = true

[weather]
enabled = true

[bar.default]
shadow = false
contact_shadow = false
margin_ends = 2
margin_edge = 2
margin_opposite_edge = 2
radius = 0
background_opacity = 0.7
widget_spacing = 10
start = ["launcher", "spacer", "workspaces", "taskbar", "active_window"]
center = ["clock", "weather", "noctalia/bongocat:cat"]
end = [
  "media",
  "tray",
  "cpu_simple",
  "ram_simple",
  "disk_simple",
  "keyboard_layout",
  "caffeine",
  "notifications",
  "clipboard",
  "oldirtty/color_picker:widget",
  "network",
  "bluetooth",
  "volume",
  "brightness",
  "battery",
  "session"
]

[dock]
shadow = false

[shell.panel]
shadow = false

[widget.launcher]
glyph = "rocket"

[widget.workspaces]
hide_when_empty = true
style = "minimal"

[widget.taskbar]
only_active_workspace = true

[widget.weather]
show_condition = false

[widget.clock]
tooltip_format = "{:%A, %B %d, %Y}"

[widget.media]
title_scroll = "on_hover"
hide_when_no_media = true
rotate_album_art = true

[widget.keyboard_layout]
hide_when_single_layout = true
show_glyph = false

[widget.network]
show_label = false

[widget.volume]
show_label = false

[widget.brightness]
show_label = false

[widget.battery]
show_label = false

[widget."noctalia/bongocat:cat"]
input_devices = ["/dev/input/by-path/platform-*-kbd"]

[widget.cpu_simple]
type = "sysmon"
stat = "cpu_usage"
visualization = "gauge"
show_value = false
show_glyph = false

[widget.ram_simple]
type = "sysmon"
stat = "ram_used"
visualization = "gauge"
show_value = false
show_glyph = false

[widget.disk_simple]
type = "sysmon"
stat = "disk_used_pct"
path = "/"
visualization = "gauge"
show_value = false
show_glyph = false
