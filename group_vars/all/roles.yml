---
default_roles:
  # required
  - role: system
    become: true
    tags: [system]

  # shell
  - role: bash
    tags: [bash]
  - role: fish
    become: true
    tags: [fish]
  - role: starship
    become: true
    tags: [starship]
  - role: fzf
    become: true
    tags: [fzf]
  - role: bat
    become: true
    tags: [bat]
  - role: lsd
    become: true
    tags: [lsd]
  - role: zoxide
    become: true
    tags: [zoxide]

  # development
  - role: git
    tags: [git]
  - role: neovim
    become: true
    tags: [neovim]
  - role: gh
    become: true
    tags: [gh]
  - role: lazygit
    become: true
    tags: [lazygit]
  - role: ssh
    become: true
    tags: [ssh]

  # terminal
  - role: kitty
    become: true
    tags: [kitty]
  - role: zellij
    become: true
    tags: [zellij]
  - role: yazi
    become: true
    tags: [yazi]

  # desktop
  - role: zen_browser
    tags: [zen-browser]
  - role: wallpapers
    tags: [wallpapers]
  - role: noctalia
    become: true
    tags: [noctalia]
  - role: niri
    become: true
    tags: [niri]

  # Start the login manager only after its compositor and desktop are installed.
  - role: noctalia_greeter
    become: true
    tags: [noctalia-greeter]

  # ai
  - role: omniroute
    tags: [ai, omniroute]
  - role: opencode
    tags: [ai, opencode]
  - role: pi
    tags: [ai, pi]

additional_roles: []
excluded_roles: []
