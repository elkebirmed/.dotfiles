---

# Root folder that holds one sub-folder per palette. Each palette folder may
# contain a Dark/ and/or a Light/ sub-folder of wallpapers:
#   * <Palette>/Dark/*  + <Palette>/Light/* -> palette is used in that mode
#   * <Palette>/*  (no Dark/Light sub-folders) -> wallpapers used for both modes
#   * no folder for the palette -> a random wallpaper is used instead
# The palette name is matched to its folder by lower-casing it and dropping
# every non-alphanumeric character, so "Tokyo-Night" matches "Tokyo Night".
noctalia_wallpaper_directory: "{{ ansible_facts['user_dir'] }}/Pictures/Wallpapers"

# Applied when ~/.cache/dotfiles/noctalia/theme does not exist yet.
noctalia_default_palette: Gruvbox
noctalia_default_mode: dark
