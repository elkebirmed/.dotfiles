---
- name: Install Lazygit
  community.general.pacman:
    name: lazygit
    state: present

- name: Ensure the Lazygit configuration directory exists
  ansible.builtin.file:
    path: "{{ lazygit_config_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Ensure the Lazygit themes directory exists
  ansible.builtin.file:
    path: "{{ lazygit_themes_dir }}"
    state: directory
    mode: "0755"
  become: false
