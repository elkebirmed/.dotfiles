---
- name: Install FNM and pnpm
  community.general.pacman:
    name: "{{ nodejs_packages }}"
    state: present
  become: true

- name: Ensure the Fish configuration drop-in directory exists
  ansible.builtin.file:
    path: "{{ fish_conf_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Link FNM shell integration for Fish
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/nodejs/files/fnm.fish"
    dest: "{{ fish_conf_dir }}/fnm.fish"
    state: link
    force: true
  become: false

- name: Link pnpm shell integration for Fish
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/nodejs/files/pnpm.fish"
    dest: "{{ fish_conf_dir }}/pnpm.fish"
    state: link
    force: true
  become: false

- name: Ensure the Fish completions directory exists for nodejs tools
  ansible.builtin.file:
    path: "{{ fish_completions_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Generate FNM completion for Fish
  ansible.builtin.command: /bin/sh -c "fnm completions --shell fish > {{ fish_completions_dir }}/fnm.fish"
  become: false

- name: Generate pnpm completion for Fish
  ansible.builtin.command: /bin/sh -c "pnpm completion fish > {{ fish_completions_dir }}/pnpm.fish"
  become: false

- name: Ensure the Bash completions directory exists for nodejs tools
  ansible.builtin.file:
    path: "{{ bash_completions_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Generate FNM completion for Bash
  ansible.builtin.command: /bin/sh -c "fnm completions --shell bash > {{ bash_completions_dir }}/fnm"
  become: false

- name: Generate pnpm completion for Bash
  ansible.builtin.command: /bin/sh -c "pnpm completion bash > {{ bash_completions_dir }}/pnpm"
  become: false
