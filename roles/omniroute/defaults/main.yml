---
ai_local_bin_dir: "{{ ansible_facts['user_dir'] }}/.local/bin"
omniroute_binary_path: "{{ ai_local_bin_dir }}/omniroute"
omniroute_version: latest
omniroute_port: 20128
omniroute_password: "{{ OMNIROUTE_PASSWORD }}"
omniroute_secret_key: "{{ OMNIROUTE_SECRET_KEY }}"
omniroute_api_key_file: "{{ ansible_facts['user_dir'] }}/.omniroute/api-key"
omniroute_env_file: "{{ ansible_facts['user_dir'] }}/.omniroute/.env"
ai_systemd_user_dir: "{{ ansible_facts['user_dir'] }}/.config/systemd/user"
