---
- name: Install fzf
  community.general.pacman:
    name: fzf
    state: present

- name: Ensure the Fish drop-in directory exists for fzf
  ansible.builtin.file:
    path: "{{ fzf_fish_conf_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Link fzf initialization in Fish
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/fzf/files/fzf.fish"
    dest: "{{ fzf_fish_conf_dir }}/fzf.fish"
    state: link
    force: true
  become: false
