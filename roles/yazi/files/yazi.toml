#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio          = [1, 4, 3]
sort_by        = "natural"
sort_sensitive = false
sort_dir_first = true
linemode       = "size"
show_hidden    = false
show_symlink   = true
scrolloff      = 5

[preview]
wrap      = "no"
tab_size  = 2
max_width = 600
