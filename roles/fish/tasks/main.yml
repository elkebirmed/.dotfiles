---
- name: Install Fish
  community.general.pacman:
    name: fish-git
    state: present

- name: Ensure the Fish configuration drop-in directory exists
  ansible.builtin.file:
    path: "{{ fish_conf_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Set Fish as the login shell for the dotfiles user
  ansible.builtin.user:
    name: "{{ dotfiles_user }}"
    shell: "{{ fish_shell_path }}"
  become: true
