---
- name: Install bat
  community.general.pacman:
    name: bat
    state: present

- name: Ensure the bat configuration directory exists
  ansible.builtin.file:
    path: "{{ bat_config_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Link the bat configuration
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/bat/files/config"
    dest: "{{ bat_config_path }}"
    state: link
    force: true
  become: false

- name: Ensure the bat themes directory exists
  ansible.builtin.file:
    path: "{{ bat_themes_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Ensure the Noctalia-generated bat theme file exists
  ansible.builtin.copy:
    content: ""
    dest: "{{ bat_theme_path }}"
    force: false
    mode: "0644"
  become: false

- name: Ensure the Fish configuration drop-in directory exists for bat
  ansible.builtin.file:
    path: "{{ fish_conf_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Link bat shell integration for Fish
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/bat/files/bat.fish"
    dest: "{{ fish_conf_dir }}/bat.fish"
    state: link
    force: true
  become: false

- name: Ensure the Fish completions directory exists for bat
  ansible.builtin.file:
    path: "{{ fish_completions_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Generate bat completion for Fish
  ansible.builtin.command: /bin/sh -c "bat --completion fish > {{ fish_completions_dir }}/bat.fish"
  become: false

- name: Ensure the Bash completions directory exists for bat
  ansible.builtin.file:
    path: "{{ bash_completions_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Generate bat completion for Bash
  ansible.builtin.command: /bin/sh -c "bat --completion bash > {{ bash_completions_dir }}/bat"
  become: false
