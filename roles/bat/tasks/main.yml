---
- name: Install bat
  community.general.pacman:
    name: bat
    state: present

- name: Ensure the bat configuration directory exists
  ansible.builtin.file:
    path: "{{ bat_config_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Link the bat configuration
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/bat/files/config"
    dest: "{{ bat_config_path }}"
    state: link
    force: true
  become: false
