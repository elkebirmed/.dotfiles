---
- name: Install Claude Code for the current user
  ansible.builtin.shell:
    cmd: "set -o pipefail && curl -fsSL {{ claude_install_url }} | bash"
    executable: /bin/bash
  args:
    creates: "{{ claude_binary_path }}"

- name: Ensure the Claude Code configuration directory exists
  ansible.builtin.file:
    path: "{{ claude_settings_path | dirname }}"
    state: directory
    mode: "0700"
  become: false

- name: Check for existing Claude Code settings
  ansible.builtin.stat:
    path: "{{ claude_settings_path }}"
  register: _claude_settings_stat
  become: false

- name: Read existing Claude Code settings
  ansible.builtin.slurp:
    src: "{{ claude_settings_path }}"
  register: _claude_settings_file
  when: _claude_settings_stat.stat.exists
  no_log: true
  become: false

- name: Parse existing Claude Code settings
  ansible.builtin.set_fact:
    _claude_settings: >-
      {{
        (_claude_settings_file.content | default('e30='))
        | b64decode
        | from_json
      }}
  no_log: true
  become: false

- name: Validate Claude Code settings structure
  ansible.builtin.assert:
    that:
      - _claude_settings is mapping
      - (_claude_settings.env | default({})) is mapping
    fail_msg: >-
      Claude Code settings at {{ claude_settings_path }} must be a JSON
      object, and its optional `env` property must also be an object.
    quiet: true
  no_log: true
  become: false

- name: Remove any default model from Claude Code settings
  ansible.builtin.set_fact:
    _claude_env_without_default_model: >-
      {{
        _claude_settings.env | default({})
        | dict2items
        | rejectattr('key', 'equalto', 'ANTHROPIC_MODEL')
        | rejectattr('key', 'equalto', 'ANTHROPIC_API_KEY')
        | items2dict
      }}
  no_log: true
  become: false

- name: Configure Claude Code to access OmniRoute without a default model
  ansible.builtin.set_fact:
    _claude_settings_with_omniroute: >-
      {{
        _claude_settings
        | combine(
            {
              'env': (
                _claude_env_without_default_model
                | combine(
                    {
                      'ANTHROPIC_BASE_URL': claude_omniroute_base_url,
                      'ANTHROPIC_AUTH_TOKEN': omniroute_api_key,
                      'CLAUDE_CODE_ENABLE_GATEWAY_MODEL_DISCOVERY': 'true'
                    }
                  )
              )
            },
            recursive=true
          )
      }}
  no_log: true
  become: false

- name: Save Claude Code OmniRoute settings
  ansible.builtin.copy:
    content: "{{ _claude_settings_with_omniroute | to_nice_json }}\n"
    dest: "{{ claude_settings_path }}"
    mode: "0600"
  no_log: true
  become: false
