---
- name: Blacklist nouveau and disable its kernel modesetting
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/nouveau/files/blacklist-nouveau.conf"
    dest: /etc/modprobe.d/blacklist-nouveau.conf
    state: link
    force: true
    owner: root
    group: root
  become: true
  notify: Rebuild initramfs

- name: Add nomodeset to the GRUB default kernel parameters
  ansible.builtin.lineinfile:
    path: /etc/default/grub
    regexp: '^(GRUB_CMDLINE_LINUX_DEFAULT=")(?![^"]*(?<!\S)nomodeset(?=\s|"))([^"]*)("$)'
    line: '\1\2 nomodeset\3'
    backrefs: true
  become: true
  when: crazy_force_nomodeset | bool
  notify: Regenerate GRUB configuration
