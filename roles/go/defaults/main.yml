---
# Go toolchain (required by Mason to build gopls and delve).
go_path: "{{ ansible_facts['user_dir'] }}/go"

# Fish shell integration paths (defined here so the go role is self-contained
# and can run before the fish role).
fish_config_dir: "{{ ansible_facts['user_dir'] }}/.config/fish"
fish_conf_dir: "{{ fish_config_dir }}/conf.d"
fish_completions_dir: "{{ fish_config_dir }}/completions"
