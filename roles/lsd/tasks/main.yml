---
- name: Install lsd
  community.general.pacman:
    name: lsd
    state: present

- name: Ensure the lsd configuration directory exists
  ansible.builtin.file:
    path: "{{ lsd_config_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Link the lsd configuration
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/lsd/files/config.yaml"
    dest: "{{ lsd_config_path }}"
    state: link
    force: true
  become: false

- name: Ensure the Noctalia-generated lsd theme file exists
  ansible.builtin.copy:
    content: "{}\n"
    dest: "{{ lsd_colors_path }}"
    force: false
    mode: "0644"
  become: false
