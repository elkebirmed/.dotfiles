---
- name: Install lsd
  community.general.pacman:
    name: lsd
    state: present

- name: Ensure the lsd configuration directory exists
  ansible.builtin.file:
    path: "{{ lsd_config_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Link the lsd configuration
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/lsd/files/config.yaml"
    dest: "{{ lsd_config_path }}"
    state: link
    force: true
  become: false

- name: Install the Base16 lsd color theme
  ansible.builtin.template:
    src: colors.yaml.j2
    dest: "{{ lsd_colors_path }}"
    mode: "0644"
  become: false
