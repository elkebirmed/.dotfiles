---
- name: Ensure bash config directory exists
  ansible.builtin.file:
    path: "{{ bash_user_config_dir }}"
    state: directory
    mode: "0700"

- name: Link bashrc bootstrap
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/bash/files/.bashrc"
    dest: "{{ bash_rc_path }}"
    state: link
    force: true
