---
- name: Install Noctalia runtime packages
  community.general.pacman:
    name:
      - evtest
      - python
      - hyprpicker
      - mako
    state: present
  become: true

- name: Install Noctalia from the AUR
  kewlfft.aur.aur:
    name: "{{ noctalia_aur_package }}"
    state: present
    use: "{{ noctalia_aur_helper }}"
  become: false

- name: Ensure the input group exists
  ansible.builtin.group:
    name: input
    state: present
    system: true
  become: true

- name: Grant the desktop user access to input devices
  ansible.builtin.user:
    name: "{{ dotfiles_user }}"
    groups: input
    append: true
  become: true

- name: Ensure the Noctalia configuration directory exists
  ansible.builtin.file:
    path: "{{ noctalia_config_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Install the declarative Noctalia configuration
  ansible.builtin.template:
    src: config.toml.j2
    dest: "{{ noctalia_config_path }}"
    mode: "0644"
  become: false

- name: Ensure the configured wallpaper directory exists
  ansible.builtin.file:
    path: "{{ noctalia_wallpaper_directory }}"
    state: directory
    mode: "0755"
  become: false

- name: Add Noctalia startup hook to Hyprland
  ansible.builtin.blockinfile:
    path: "{{ noctalia_hyprland_config_path }}"
    create: true
    mode: "0644"
    marker: "-- {mark} ANSIBLE MANAGED NOCTALIA AUTOSTART"
    block: |
      hl.on("hyprland.start", function()
          hl.exec_cmd("noctalia")
      end)
  become: false
