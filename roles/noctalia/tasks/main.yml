---
- name: Install Noctalia runtime packages
  community.general.pacman:
    name:
      - evtest
      - python
      - hyprpicker
      - mako
    state: present
  become: true

- name: Install Noctalia from the Caotic-AUR binary repository
  community.general.pacman:
    name: "{{ noctalia_aur_package }}"
    state: present
  become: false

- name: Ensure the input group exists
  ansible.builtin.group:
    name: input
    state: present
    system: true
  become: true

- name: Grant the desktop user access to input devices
  ansible.builtin.user:
    name: "{{ dotfiles_user }}"
    groups: input
    append: true
  become: true

- name: Ensure the Noctalia configuration directory exists
  ansible.builtin.file:
    path: "{{ noctalia_config_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Ensure the Noctalia palette directory exists
  ansible.builtin.file:
    path: "{{ noctalia_palette_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Install the Base16 Gruvbox Dark Medium Noctalia palette
  ansible.builtin.template:
    src: base16-palette.json.j2
    dest: "{{ noctalia_palette_path }}"
    mode: "0644"
  become: false

- name: Link the Noctalia configuration
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/noctalia/files/config.toml"
    dest: "{{ noctalia_config_path }}"
    state: link
    force: true
  become: false

- name: Configure the variable Noctalia settings
  ansible.builtin.template:
    src: runtime.toml.j2
    dest: "{{ noctalia_config_dir }}/runtime.toml"
    mode: "0644"
  become: false

- name: Ensure the Hyprland configuration directory exists
  ansible.builtin.file:
    path: "{{ noctalia_hyprland_config_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Link the Noctalia Hyprland startup hook
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/noctalia/files/noctalia.lua"
    dest: "{{ noctalia_hyprland_hook_path }}"
    state: link
    force: true
  become: false
