---
- name: Install Noctalia runtime packages
  community.general.pacman:
    name:
      - evtest
      - hyprpicker
      - playerctl
    state: present
  become: true

- name: Install Noctalia from the Caotic-AUR binary repository
  community.general.pacman:
    name: "{{ noctalia_aur_package }}"
    state: present
  become: false

- name: Ensure the input group exists
  ansible.builtin.group:
    name: input
    state: present
    system: true
  become: true

- name: Grant the desktop user access to input devices
  ansible.builtin.user:
    name: "{{ dotfiles_user }}"
    groups: input
    append: true
  become: true

- name: Ensure the Noctalia configuration directory exists
  ansible.builtin.file:
    path: "{{ noctalia_config_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Ensure the Noctalia palette directory exists
  ansible.builtin.file:
    path: "{{ noctalia_palette_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Ensure the Noctalia templates directory exists
  ansible.builtin.file:
    path: "{{ noctalia_templates_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Ensure the Noctalia hooks directory exists
  ansible.builtin.file:
    path: "{{ noctalia_hooks_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Ensure the Fish drop-in directory exists for the Noctalia theme
  ansible.builtin.file:
    path: "{{ fish_conf_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Ensure the Fish completions directory exists for Noctalia
  ansible.builtin.file:
    path: "{{ fish_completions_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Generate Noctalia completion for Fish
  ansible.builtin.command: /bin/sh -c "noctalia completions fish > {{ fish_completions_dir }}/noctalia.fish"
  become: false

- name: Ensure the Bash completions directory exists for Noctalia
  ansible.builtin.file:
    path: "{{ bash_completions_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Generate Noctalia completion for Bash
  ansible.builtin.command: /bin/sh -c "noctalia completions bash > {{ bash_completions_dir }}/noctalia"
  become: false

- name: Ensure the directory for the palette switch helper exists
  ansible.builtin.file:
    path: "{{ noctalia_bin_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Ensure the runtime theme cache directory exists
  ansible.builtin.file:
    path: "{{ noctalia_runtime_cache_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Link the Noctalia core palettes as custom palettes
  ansible.builtin.file:
    src: "{{ item }}"
    dest: "{{ noctalia_palette_dir }}/{{ item | basename }}"
    state: link
    force: true
  loop: "{{ query('ansible.builtin.fileglob', noctalia_palettes_source_dir ~ '/*.json') }}"
  become: false

- name: Link the Noctalia configuration
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/noctalia/files/config.toml"
    dest: "{{ noctalia_config_path }}"
    state: link
    force: true
  become: false

- name: Link Noctalia app theme templates
  ansible.builtin.file:
    src: "{{ item }}"
    dest: "{{ noctalia_templates_dir }}/{{ item | basename }}"
    state: link
    force: true
  loop: "{{ query('ansible.builtin.fileglob', dotfiles_dir ~ '/roles/noctalia/files/templates/*') }}"
  become: false

- name: Link Noctalia theme hooks
  ansible.builtin.file:
    src: "{{ item }}"
    dest: "{{ noctalia_hooks_dir }}/{{ item | basename }}"
    state: link
    force: true
  loop: "{{ query('ansible.builtin.fileglob', dotfiles_dir ~ '/roles/noctalia/files/hooks/*') }}"
  become: false

- name: Link the palette and wallpaper switch helper
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/noctalia/files/bin/noctalia-theme"
    dest: "{{ noctalia_theme_script_path }}"
    state: link
    force: true
  become: false

# The helper resolves the active palette, mode and wallpaper from the runtime
# cache (or the defaults) and the wallpaper folders on disk, so the pairing
# logic lives in one place. resolve is read-only, so it is safe in --check.
- name: Resolve the active palette, mode and wallpaper
  ansible.builtin.command: "{{ noctalia_theme_script_path }} resolve"
  register: noctalia_theme_resolve
  changed_when: false
  check_mode: false
  environment:
    NOCTALIA_WALLPAPER_DIR: "{{ noctalia_wallpaper_directory }}"
    NOCTALIA_DEFAULT_PALETTE: "{{ noctalia_default_palette }}"
    NOCTALIA_DEFAULT_MODE: "{{ noctalia_default_mode }}"
  become: false

- name: Parse the resolved theme
  ansible.builtin.set_fact:
    noctalia_theme_fields: "{{ (noctalia_theme_resolve.stdout | trim).split('\t') + ['', '', ''] }}"

- name: Select the active palette, mode and wallpaper
  ansible.builtin.set_fact:
    noctalia_active_palette: "{{ noctalia_theme_fields[0] }}"
    noctalia_active_mode: "{{ noctalia_theme_fields[1] }}"
    noctalia_active_wallpaper: "{{ noctalia_theme_fields[2] }}"
  become: false

- name: Configure the variable Noctalia settings
  ansible.builtin.template:
    src: runtime.toml.j2
    dest: "{{ noctalia_config_dir }}/runtime.toml"
    mode: "0644"
  become: false

# Re-applies the palette/mode/wallpaper recorded at runtime so a runtime choice
# survives every Ansible run. sync also refreshes ~/.cache/dotfiles/noctalia/theme.
- name: Apply the recorded theme now (if Noctalia is running)
  ansible.builtin.command: "{{ noctalia_theme_script_path }} sync"
  become: false
  changed_when: false
  failed_when: false
  environment:
    NOCTALIA_WALLPAPER_DIR: "{{ noctalia_wallpaper_directory }}"
    NOCTALIA_DEFAULT_PALETTE: "{{ noctalia_default_palette }}"
    NOCTALIA_DEFAULT_MODE: "{{ noctalia_default_mode }}"
