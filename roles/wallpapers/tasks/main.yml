---
- name: Ensure the wallpaper directory exists
  ansible.builtin.file:
    path: "{{ wallpapers_target_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Ensure wallpaper subdirectories exist
  ansible.builtin.file:
    path: "{{ wallpapers_target_dir }}/{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  with_community.general.filetree: "{{ wallpapers_source_dir }}/"
  when: item.state == 'directory'
  become: false

- name: Link bundled wallpapers
  ansible.builtin.file:
    src: "{{ item.src }}"
    dest: "{{ wallpapers_target_dir }}/{{ item.path }}"
    state: link
    follow: false
  with_community.general.filetree: "{{ wallpapers_source_dir }}/"
  when: item.state == 'file'
  become: false
