---
- name: Install Kitty
  community.general.pacman:
    name: kitty
    state: present

- name: Ensure the Kitty configuration directory exists
  ansible.builtin.file:
    path: "{{ kitty_config_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Link the Kitty configuration
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/kitty/files/kitty.conf"
    dest: "{{ kitty_config_path }}"
    state: link
    force: true
  become: false

- name: Configure the Kitty font
  ansible.builtin.template:
    src: kitty-fonts.conf.j2
    dest: "{{ kitty_config_dir }}/kitty-fonts.conf"
    mode: "0644"
  become: false

- name: Ensure the Noctalia-generated Kitty color file can be included
  ansible.builtin.copy:
    content: ""
    dest: "{{ kitty_config_dir }}/kitty-colors.conf"
    force: false
    mode: "0644"
  become: false
