---
- name: Install Kitty
  community.general.pacman:
    name: kitty
    state: present

- name: Ensure the Kitty configuration directory exists
  ansible.builtin.file:
    path: "{{ kitty_config_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Link the Kitty configuration
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/kitty/files/kitty.conf"
    dest: "{{ kitty_config_path }}"
    state: link
    force: true
  become: false

- name: Configure Kitty colors from the Base16 palette
  ansible.builtin.template:
    src: base16-colors.conf.j2
    dest: "{{ kitty_config_dir }}/base16-colors.conf"
    mode: "0644"
  become: false
