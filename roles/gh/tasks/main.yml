---
- name: Install GitHub CLI
  community.general.pacman:
    name: github-cli
    state: present

- name: Ensure the GitHub CLI configuration directory exists
  ansible.builtin.file:
    path: "{{ gh_config_dir }}"
    state: directory
    mode: "0700"
  become: false

- name: Link the GitHub CLI configuration
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/gh/files/config.yml"
    dest: "{{ gh_config_path }}"
    state: link
    force: true
  become: false

- name: Require a GitHub token in the encrypted secrets file
  ansible.builtin.assert:
    that:
      - GH_TOKEN is defined
      - GH_TOKEN | string | length > 0
    fail_msg: >-
      Add a GitHub personal access token as GH_TOKEN in
      {{ gh_sops_file }} using sops before running the gh role.
    quiet: true
  become: false

- name: Ensure the Fish drop-in directory exists for GitHub CLI
  ansible.builtin.file:
    path: "{{ gh_fish_dropin | dirname }}"
    state: directory
    mode: "0755"
  become: false

- name: Configure Fish to run GitHub CLI with SOPS credentials
  ansible.builtin.template:
    src: gh.fish.j2
    dest: "{{ gh_fish_dropin }}"
    mode: "0644"
  become: false

- name: Verify GitHub CLI authentication from SOPS
  ansible.builtin.command:
    argv:
      - sops
      - exec-env
      - "{{ gh_sops_file }}"
      - "{{ gh_binary_path }} auth status --hostname github.com"
  changed_when: false
  no_log: true
  become: false

- name: Ensure the Fish completions directory exists for gh
  ansible.builtin.file:
    path: "{{ fish_completions_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Generate gh completion for Fish
  ansible.builtin.command: /bin/sh -c "{{ gh_binary_path }} completion fish > {{ fish_completions_dir }}/gh.fish"
  become: false

- name: Ensure the Bash completions directory exists for gh
  ansible.builtin.file:
    path: "{{ bash_completions_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Generate gh completion for Bash
  ansible.builtin.command: /bin/sh -c "{{ gh_binary_path }} completion bash > {{ bash_completions_dir }}/gh"
  become: false

- name: Configure git to use gh as credential helper (push to private repos)
  ansible.builtin.command: git config --global credential.helper gh
  become: false
  changed_when: false
