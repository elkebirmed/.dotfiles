---
# ---------------------------------------------------------------------------
# Identity, time and locale  (empty string = leave the current value alone)
# ---------------------------------------------------------------------------
system_hostname: ""
system_timezone: "" # e.g. "Europe/Paris"
system_keymap: "" # console keymap, e.g. "us", "fr"
system_locale: "en_US.UTF-8" # written to /etc/locale.conf as LANG
system_locales: # entries to enable in /etc/locale.gen
  - "en_US.UTF-8 UTF-8"

# ---------------------------------------------------------------------------
# pacman / makepkg
# ---------------------------------------------------------------------------
system_pacman_options: # [options] section of /etc/pacman.conf
  - { name: Color }
  - { name: VerbosePkgLists }
  - { name: ParallelDownloads, value: 5 }

system_enable_multilib: false
system_full_upgrade: true # pacman -Syu on every run (skip with --skip-tags upgrade)
system_makepkg_parallel: true # MAKEFLAGS="-jN" in /etc/makepkg.conf

# ---------------------------------------------------------------------------
# Packages
# ---------------------------------------------------------------------------
system_packages:
  - base-devel
  - git
  - openssh
  - curl
  - wget
  - rsync
  - unzip
  - zip
  - paru
  - man-db
  - man-pages
  - bash-completion
  - pacman-contrib
  - htop
  - ripgrep
  - fd
  - jq
  - age
  - sops
  - open-iscsi

# Per-machine tweaks (set these in host_vars/<hostname>/):
system_packages_extra: [] # installed in addition to system_packages
system_packages_exclude: [] # removed from the final list (wins over both lists above)

# ---------------------------------------------------------------------------
# Mirrors (reflector)
# ---------------------------------------------------------------------------
system_reflector_enabled: true
system_reflector_countries: [] # e.g. ["France", "Germany"]; empty = worldwide
system_reflector_protocols: ["https"]
system_reflector_latest: 20
system_reflector_sort: rate

# ---------------------------------------------------------------------------
# systemd units to enable and start
# ---------------------------------------------------------------------------
system_services: # base units, enabled everywhere
  - systemd-timesyncd.service
  - fstrim.timer
  - paccache.timer

system_services_extra: [] # machine-specific units, merged with system_services

# ---------------------------------------------------------------------------
# Kernel parameters, written to /etc/sysctl.d/99-ansible.conf
# ---------------------------------------------------------------------------
system_sysctl:
  vm.swappiness: 10
  fs.inotify.max_user_watches: 524288
