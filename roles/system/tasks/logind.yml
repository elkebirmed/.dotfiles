---
- name: Ensure the systemd-logind drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Link the systemd-logind drop-in configuration
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/system/files/logind.conf.d/power-button.conf"
    dest: /etc/systemd/logind.conf.d/power-button.conf
    state: link
    force: true
    owner: root
    group: root
  notify: Reload systemd-logind
