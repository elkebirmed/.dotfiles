---
- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ system_hostname }}"
    use: systemd
  when: system_hostname | length > 0

- name: Set timezone
  community.general.timezone:
    name: "{{ system_timezone }}"
  when: system_timezone | length > 0

- name: Enable locales in /etc/locale.gen
  ansible.builtin.lineinfile:
    path: /etc/locale.gen
    regexp: '^#?\s*{{ item | regex_escape }}\s*$'
    line: "{{ item }}"
  loop: "{{ system_locales }}"
  notify: Generate locales

- name: Set the system locale
  ansible.builtin.lineinfile:
    path: /etc/locale.conf
    regexp: '^LANG='
    line: "LANG={{ system_locale }}"
    create: true
    owner: root
    group: root
    mode: "0644"
  when: system_locale | length > 0

- name: Set the console keymap
  ansible.builtin.lineinfile:
    path: /etc/vconsole.conf
    regexp: '^KEYMAP='
    line: "KEYMAP={{ system_keymap }}"
    create: true
    owner: root
    group: root
    mode: "0644"
  when: system_keymap | length > 0

- name: Query the current X11 keyboard settings
  ansible.builtin.command:
    cmd: localectl status
  register: _system_localectl
  changed_when: false
  check_mode: false
  when: keyboard is defined

- name: Configure the X11 keyboard settings
  ansible.builtin.command:
    argv:
      - localectl
      - set-x11-keymap
      - "{{ keyboard.layout | default('us') }}"
      - "{{ keyboard.model | default('pc105') }}"
      - "{{ keyboard.variant | default('') }}"
      - "{{ keyboard.options | default([]) | join(',') }}"
  become: true
  changed_when: true
  vars:
    _system_x11_current: >-
      {{ _system_localectl.stdout_lines
         | select('search', '^\s*X11 (Layout|Model|Variant|Options):')
         | map('regex_replace', '^\s*X11 (\w+):\s*(.*?)\s*$', '\1=\2')
         | map('split', '=', 1)
         | items2dict(key_name=0, value_name=1) }}
  when:
    - keyboard is defined
    - >-
      (_system_x11_current.get('Layout', '') != (keyboard.layout | default('us')))
      or (_system_x11_current.get('Model', '') != (keyboard.model | default('pc105')))
      or (_system_x11_current.get('Variant', '') != (keyboard.variant | default('')))
      or (_system_x11_current.get('Options', '') != (keyboard.options | default([]) | join(',')))
