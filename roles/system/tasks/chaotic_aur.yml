---
- name: Check whether the Chaotic-AUR keyring and mirrorlist are installed
  ansible.builtin.command:
    argv:
      - pacman
      - -Q
      - chaotic-keyring
      - chaotic-mirrorlist
  register: _system_chaotic_packages
  changed_when: false
  failed_when: false

- name: Import the Chaotic-AUR signing key
  ansible.builtin.command:
    argv:
      - pacman-key
      - --recv-key
      - 3056513887B78AEB
      - --keyserver
      - keyserver.ubuntu.com
  when: _system_chaotic_packages.rc != 0
  changed_when: true

- name: Locally sign the Chaotic-AUR signing key
  ansible.builtin.command:
    argv:
      - pacman-key
      - --lsign-key
      - 3056513887B78AEB
  when: _system_chaotic_packages.rc != 0
  changed_when: true

- name: Install Chaotic-AUR keyring and mirrorlist
  ansible.builtin.command:
    argv:
      - pacman
      - -U
      - --noconfirm
      - https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-keyring.pkg.tar.zst
      - https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-mirrorlist.pkg.tar.zst
  when: _system_chaotic_packages.rc != 0
  changed_when: true

- name: Enable the Chaotic-AUR repository
  ansible.builtin.blockinfile:
    path: /etc/pacman.conf
    marker: "# {mark} ANSIBLE MANAGED CHAOTIC-AUR"
    block: |
      [chaotic-aur]
      Include = /etc/pacman.d/chaotic-mirrorlist
