---
- name: Generate locales
  ansible.builtin.command: locale-gen
  changed_when: true

- name: Run reflector
  ansible.builtin.systemd_service:
    name: reflector.service
    state: restarted

- name: Reload systemd-logind
  ansible.builtin.systemd_service:
    name: systemd-logind
    state: reloaded
  become: true
