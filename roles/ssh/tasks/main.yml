---
- name: Install OpenSSH
  community.general.pacman:
    name: openssh
    state: present

- name: Ensure the SSH configuration directory exists
  ansible.builtin.file:
    path: "{{ ssh_config_dir }}"
    state: directory
    mode: "0700"
  become: false

- name: Link the SSH client configuration
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/ssh/files/config"
    dest: "{{ ssh_config_path }}"
    state: link
    force: true
  become: false
