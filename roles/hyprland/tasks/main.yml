---
- name: Install Hyprland
  community.general.pacman:
    name: hyprland
    state: present

- name: Install hyprmod from the AUR
  kewlfft.aur.aur:
    name: hyprmod
    use: paru
    state: present
  become: false

- name: Ensure the Hyprland configuration directory exists
  ansible.builtin.file:
    path: "{{ hyprland_config_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Link the Hyprland Lua configuration
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/hyprland/files/hyprland.lua"
    dest: "{{ hyprland_config_path }}"
    state: link
    force: true
  become: false

- name: Configure Hyprland keybindings
  ansible.builtin.template:
    src: keybinds.lua.j2
    dest: "{{ hyprland_config_dir }}/keybinds.lua"
    mode: "0644"
  become: false

- name: Configure Hyprland Base16 border colors
  ansible.builtin.template:
    src: colors.lua.j2
    dest: "{{ hyprland_config_dir }}/colors.lua"
    mode: "0644"
  become: false
