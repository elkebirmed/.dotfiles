---
- name: Require an OpenRouter API key in the encrypted secrets file
  ansible.builtin.assert:
    that:
      - OPENROUTER_API_KEY is defined
      - OPENROUTER_API_KEY | string | length > 0
    fail_msg: >-
      Add OPENROUTER_API_KEY to {{ ai_secrets_file }} using sops before
      running the ai role.
    quiet: true
  become: false

- name: Install omp for the current user
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      curl -fsSL {{ ai_install_url }} |
      bash -s -- --binary {{ ('--ref ' ~ ai_version) if ai_version | length > 0 else '' }}
    creates: "{{ ai_omp_binary_path }}"
  args:
    executable: /bin/bash

- name: Create the omp agent configuration directory
  ansible.builtin.file:
    path: "{{ ai_agent_dir }}"
    state: directory
    mode: "0700"

- name: Check whether omp models configuration already exists
  ansible.builtin.stat:
    path: "{{ ai_models_path }}"
  register: _ai_models_config

- name: Configure OpenRouter API key reference for omp
  ansible.builtin.copy:
    dest: "{{ ai_models_path }}"
    content: |
      providers:
        openrouter:
          baseUrl: https://openrouter.ai/api/v1
          api: openai
          apiKey: OPENROUTER_API_KEY
    mode: "0600"
    force: false
  when: not _ai_models_config.stat.exists

- name: Check for existing shell startup files
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/{{ item }}"
  register: _ai_shell_startup_files
  loop:
    - .bashrc
    - .zshrc
  loop_control:
    label: "{{ item }}"

- name: Ensure the bash drop-in directory exists
  ansible.builtin.file:
    path: "{{ ai_shell_dropin | dirname }}"
    state: directory
    mode: "0700"

- name: Install the omp wrapper for secure OpenRouter env injection
  ansible.builtin.copy:
    dest: "{{ ai_shell_dropin }}"
    mode: "0644"
    content: |
      # Managed by the ai role; sourced by ~/.bashrc.
      omp() {
        local openrouter_api_key
        openrouter_api_key="$(sops decrypt --extract '["OPENROUTER_API_KEY"]' "{{ ai_secrets_file }}")" || return
        if [[ -z "$openrouter_api_key" ]]; then
          printf 'OPENROUTER_API_KEY is empty in {{ ai_secrets_file }}\n' >&2
          return 1
        fi
        OPENROUTER_API_KEY="$openrouter_api_key" "{{ ai_omp_binary_path }}" "$@"
      }

- name: Ensure the Fish drop-in directory exists for omp
  ansible.builtin.file:
    path: "{{ ai_fish_dropin | dirname }}"
    state: directory
    mode: "0755"
  become: false

- name: Install the Fish omp wrapper for secure OpenRouter env injection
  ansible.builtin.copy:
    dest: "{{ ai_fish_dropin }}"
    mode: "0644"
    content: |
      function omp
          set -l openrouter_api_key (sops decrypt --extract '["OPENROUTER_API_KEY"]' "{{ ai_secrets_file }}")
          or return
          if test -z "$openrouter_api_key"
              echo "OPENROUTER_API_KEY is empty in {{ ai_secrets_file }}" >&2
              return 1
          end
          set -lx OPENROUTER_API_KEY "$openrouter_api_key"
          "{{ ai_omp_binary_path }}" $argv
      end
  become: false

- name: Verify OpenRouter credential injection from SOPS
  ansible.builtin.command:
    argv:
      - sops
      - exec-env
      - "{{ ai_secrets_file }}"
      - test -n "$OPENROUTER_API_KEY"
  changed_when: false
  no_log: true
  become: false
