---
- name: Install omp for the current user
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      curl -fsSL {{ ai_install_url }} |
      bash -s -- --binary {{ ('--ref ' ~ ai_version) if ai_version | length > 0 else '' }}
    creates: "{{ ai_omp_binary_path }}"
  args:
    executable: /bin/bash

- name: Create the omp agent configuration directory
  ansible.builtin.file:
    path: "{{ ai_agent_dir }}"
    state: directory
    mode: "0700"

- name: Check whether omp models configuration already exists
  ansible.builtin.stat:
    path: "{{ ai_models_path }}"
  register: _ai_models_config

- name: Configure OpenRouter API key reference for omp
  ansible.builtin.copy:
    dest: "{{ ai_models_path }}"
    content: |
      providers:
        openrouter:
          baseUrl: https://openrouter.ai/api/v1
          api: openai
          apiKey: OPENROUTER_API_KEY
    mode: "0600"
    force: false
  when: not _ai_models_config.stat.exists

- name: Check for existing shell startup files
  ansible.builtin.stat:
    path: "{{ ansible_facts['user_dir'] }}/{{ item }}"
  register: _ai_shell_startup_files
  loop:
    - .bashrc
    - .zshrc
  loop_control:
    label: "{{ item }}"

# Older revisions injected the omp() wrapper and API keys directly into the
# shell startup files; the wrapper now lives in ~/.config/bash/omp.sh.
- name: Remove legacy ansible-managed shell startup blocks
  ansible.builtin.blockinfile:
    path: "{{ item.0 }}"
    marker: "{{ item.1 }}"
    state: absent
  loop: >-
    {{ _ai_shell_startup_files.results
       | selectattr('stat.exists')
       | map(attribute='stat.path')
       | list
       | product(ai_legacy_block_markers)
       | list }}
  loop_control:
    label: "{{ item.0 }} {{ item.1 }}"

- name: Ensure the bash drop-in directory exists
  ansible.builtin.file:
    path: "{{ ai_shell_dropin | dirname }}"
    state: directory
    mode: "0700"

- name: Install the omp wrapper for secure OpenRouter env injection
  ansible.builtin.copy:
    dest: "{{ ai_shell_dropin }}"
    mode: "0644"
    content: |
      # Managed by the ai role; sourced by ~/.bashrc.
      omp() {
        sops exec-env "{{ ai_secrets_file }}" -- "{{ ai_omp_binary_path }}" "$@"
      }
