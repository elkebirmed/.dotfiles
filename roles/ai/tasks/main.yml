---
- name: Install Node.js and npm for OmniRoute
  community.general.pacman:
    name:
      - nodejs
      - npm
    state: present
  become: true

- name: Install OmniRoute for the current user
  ansible.builtin.command:
    argv:
      - npm
      - install
      - --global
      - "omniroute@{{ ai_omniroute_version }}"
  environment:
    npm_config_prefix: "{{ ansible_facts['user_dir'] }}/.local"
  args:
    creates: "{{ ai_omniroute_binary_path }}"

- name: Install Claude Code for the current user
  ansible.builtin.shell:
    cmd: "set -o pipefail && curl -fsSL {{ ai_claude_install_url }} | bash"
    executable: /bin/bash
  args:
    creates: "{{ ai_claude_binary_path }}"

- name: Ensure the OmniRoute user service directory exists
  ansible.builtin.file:
    path: "{{ ai_systemd_user_dir }}"
    state: directory
    mode: "0700"
  become: false

- name: Link the OmniRoute user service
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/ai/files/omniroute.service"
    dest: "{{ ai_systemd_user_dir }}/omniroute.service"
    state: link
    force: true
  register: _ai_omniroute_service
  become: false

- name: Ensure the OmniRoute service drop-in directory exists
  ansible.builtin.file:
    path: "{{ ai_systemd_user_dir }}/omniroute.service.d"
    state: directory
    mode: "0700"
  become: false

- name: Configure the variable OmniRoute service settings
  ansible.builtin.template:
    src: omniroute.service.d/override.conf.j2
    dest: "{{ ai_systemd_user_dir }}/omniroute.service.d/override.conf"
    mode: "0644"
  register: _ai_omniroute_service_override
  become: false

- name: Enable and start OmniRoute
  ansible.builtin.systemd_service:
    name: omniroute.service
    daemon_reload: "{{ _ai_omniroute_service.changed or _ai_omniroute_service_override.changed }}"
    enabled: true
    state: "{{ 'restarted' if (_ai_omniroute_service.changed or _ai_omniroute_service_override.changed) else 'started' }}"
    scope: user
  become: false
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ ansible_facts['user_uid'] }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ ansible_facts['user_uid'] }}/bus"

- name: Ensure the Bash drop-in directory exists
  ansible.builtin.file:
    path: "{{ ai_bash_dropin | dirname }}"
    state: directory
    mode: "0700"
  become: false

- name: Install the Bash Claude Code launcher
  ansible.builtin.template:
    src: omniroute.sh.j2
    dest: "{{ ai_bash_dropin }}"
    mode: "0644"
  become: false

- name: Ensure the Fish drop-in directory exists
  ansible.builtin.file:
    path: "{{ ai_fish_dropin | dirname }}"
    state: directory
    mode: "0755"
  become: false

- name: Install the Fish Claude Code launcher
  ansible.builtin.template:
    src: omniroute.fish.j2
    dest: "{{ ai_fish_dropin }}"
    mode: "0644"
  become: false
