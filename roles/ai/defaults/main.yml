---
ai_omp_binary_path: "{{ ansible_facts['user_dir'] }}/.local/bin/omp"
ai_agent_dir: "{{ ansible_facts['user_dir'] }}/.omp/agent"
ai_models_path: "{{ ai_agent_dir }}/models.yml"
ai_install_url: https://omp.sh/install
ai_version: "" # pinned release tag; "" installs the latest
ai_shell_dropin: "{{ ansible_facts['user_dir'] }}/.config/bash/omp.sh"
ai_fish_dropin: "{{ ansible_facts['user_dir'] }}/.config/fish/conf.d/omp.fish"
ai_secrets_file: "{{ dotfiles_dir }}/group_vars/all/ai.sops.yaml"
