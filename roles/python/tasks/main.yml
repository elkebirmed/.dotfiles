---
- name: Install pyenv
  community.general.pacman:
    name: pyenv
    state: present
  become: true

- name: Ensure the Fish configuration drop-in directory exists
  ansible.builtin.file:
    path: "{{ fish_conf_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Link pyenv shell integration for Fish
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/python/files/pyenv.fish"
    dest: "{{ fish_conf_dir }}/pyenv.fish"
    state: link
    force: true
  become: false
