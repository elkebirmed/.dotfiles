---
- name: Install Starship
  community.general.pacman:
    name: starship
    state: present

- name: Ensure the Starship configuration directory exists
  ansible.builtin.file:
    path: "{{ starship_config_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Link the Starship configuration
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/starship/files/starship.toml"
    dest: "{{ starship_config_path }}"
    state: link
    force: true
  become: false

- name: Ensure the Fish drop-in directory exists for Starship
  ansible.builtin.file:
    path: "{{ starship_fish_conf_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Link Starship initialization in Fish
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/starship/files/starship.fish"
    dest: "{{ starship_fish_conf_dir }}/starship.fish"
    state: link
    force: true
  become: false
