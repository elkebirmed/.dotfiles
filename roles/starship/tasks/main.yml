---
- name: Install Starship
  community.general.pacman:
    name: starship
    state: present

- name: Ensure the Starship configuration directory exists
  ansible.builtin.file:
    path: "{{ starship_config_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Install the Base16 Starship configuration
  ansible.builtin.template:
    src: starship.toml.j2
    dest: "{{ starship_config_path }}"
    mode: "0644"
  become: false

- name: Ensure the Fish drop-in directory exists for Starship
  ansible.builtin.file:
    path: "{{ starship_fish_conf_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Initialize Starship in Fish
  ansible.builtin.copy:
    src: starship.fish
    dest: "{{ starship_fish_conf_dir }}/starship.fish"
    mode: "0644"
    force: false
  become: false
