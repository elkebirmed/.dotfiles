---
- name: Install Neovim
  community.general.pacman:
    name: neovim
    state: present

- name: Ensure the Neovim configuration directory exists
  ansible.builtin.file:
    path: "{{ neovim_config_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Link the Neovim configuration
  ansible.builtin.file:
    src: "{{ dotfiles_dir }}/roles/neovim/files/init.lua"
    dest: "{{ neovim_config_path }}"
    state: link
    force: true
  become: false
