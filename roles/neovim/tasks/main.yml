---
- name: Install Neovim
  community.general.pacman:
    name: neovim
    state: present

- name: Ensure the Neovim configuration directory exists
  ansible.builtin.file:
    path: "{{ neovim_config_dir }}"
    state: directory
    mode: "0755"
  become: false

- name: Install a starter Neovim configuration
  ansible.builtin.copy:
    src: init.lua
    dest: "{{ neovim_config_path }}"
    mode: "0644"
    force: false
  become: false
