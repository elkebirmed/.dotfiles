---
ai_local_bin_dir: "{{ ansible_facts['user_dir'] }}/.local/bin"
ai_omniroute_binary_path: "{{ ai_local_bin_dir }}/omniroute"
ai_omniroute_version: latest
ai_omniroute_port: 20128
ai_omniroute_model: auto/cheap
ai_claude_binary_path: "{{ ai_local_bin_dir }}/claude"
ai_claude_install_url: https://claude.ai/install.sh
ai_bash_dropin: "{{ ansible_facts['user_dir'] }}/.config/bash/omniroute.sh"
ai_fish_dropin: "{{ ansible_facts['user_dir'] }}/.config/fish/conf.d/omniroute.fish"
ai_systemd_user_dir: "{{ ansible_facts['user_dir'] }}/.config/systemd/user"
